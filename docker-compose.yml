services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pronobot}
      POSTGRES_USER: ${POSTGRES_USER:-pronobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    image: pronobot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pronobot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pronobot}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
